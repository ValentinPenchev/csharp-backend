<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Админ панел - C# Проверител</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-8 flex justify-between items-center border-b pb-4">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Управление на Задания</h1>
            <span class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-semibold">Администратор</span>
        </header>

        <!-- Създаване на ново задание с еталонен файл -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <h2 class="text-lg font-semibold mb-4 text-slate-800">Създай ново задание и еталон за проверка</h2>
            <form id="create-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Заглавие на задачата</label>
                    <input type="text" id="title" required class="w-full px-4 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Описание / Условия</label>
                    <textarea id="description" rows="3" required class="w-full px-4 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Примерен код / Word файл с критерии (за проверка)</label>
                    <input type="file" id="reference-file" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition shadow-sm">Създай задача и генерирай линк</button>
            </form>
        </div>

        <!-- Списък със задачи и техните линкове -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <h2 class="text-lg font-semibold mb-4 text-slate-800">Активни задания и индивидуални линкове</h2>
            <div id="assignments-list" class="space-y-3">
                <p class="text-sm text-slate-400">Зареждане на задания...</p>
            </div>
        </div>

        <!-- Предадени материали и оценки -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold mb-4 text-slate-800">Предадени материали от ученици</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500">
                            <th class="py-3 px-4">Ученик</th>
                            <th class="py-3 px-4">Задание</th>
                            <th class="py-3 px-4">Файл на ученика</th>
                            <th class="py-3 px-4">Точки</th>
                            <th class="py-3 px-4">Оценка</th>
                            <th class="py-3 px-4">Действие</th>
                        </tr>
                    </thead>
                    <tbody id="submissions-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://grading-platform-v2.onrender.com"; // Вашият Render линк

        async function loadData() {
            try {
                // Зареждане на задания
                const resAss = await fetch(`${API_URL}/api/assignments`);
                const assignments = await resAss.json();
                const listEl = document.getElementById('assignments-list');
                listEl.innerHTML = '';
                
                if (assignments.length === 0) {
                    listEl.innerHTML = '<p class="text-sm text-slate-500">Все още няма създадени задания.</p>';
                }

                assignments.forEach(a => {
                    // Генериране на линк спрямо текущия хост (GitHub Pages) или рутьовете
                    const baseDomain = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
                    const studentLink = `${baseDomain}index.html?id=${a.id}`;
                    
                    listEl.innerHTML += `
                        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                            <div>
                                <h3 class="font-semibold text-slate-800">${a.title}</h3>
                                <p class="text-xs text-slate-500">${a.description}</p>
                                ${a.reference_file_url ? `<a href="${a.reference_file_url}" target="_blank" class="text-xs text-indigo-600 hover:underline mt-1 inline-block">📄 Преглед на еталонен/помощен файл</a>` : ''}
                            </div>
                            <div class="flex items-center gap-2 w-full md:w-auto">
                                <input type="text" readonly value="${studentLink}" class="bg-white border px-3 py-1.5 rounded-lg text-xs text-slate-600 w-full md:w-80 select-all">
                                <button onclick="navigator.clipboard.writeText('${studentLink}'); alert('Линкът е копиран!');" class="bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap">Копирай</button>
                            </div>
                        </div>`;
                });

                // Зареждане на предадени материали
                const resSub = await fetch(`${API_URL}/api/submissions`);
                const submissions = await resSub.json();
                const subListEl = document.getElementById('submissions-list');
                subListEl.innerHTML = '';

                submissions.forEach(s => {
                    subListEl.innerHTML += `
                        <tr class="border-b border-slate-100 hover:bg-slate-50">
                            <td class="py-3 px-4 font-medium text-slate-800">${s.student_name}</td>
                            <td class="py-3 px-4 text-slate-600">${s.assignments?.title || '—'}</td>
                            <td class="py-3 px-4"><a href="${s.file_url}" target="_blank" class="text-indigo-600 hover:underline font-medium">Свали код</a></td>
                            <td class="py-3 px-4"><input type="number" id="points-${s.id}" value="${s.points || 0}" class="w-16 border rounded px-2 py-1 text-center"></td>
                            <td class="py-3 px-4"><input type="text" id="grade-${s.id}" value="${s.grade || ''}" placeholder="напр. 6" class="w-16 border rounded px-2 py-1 text-center"></td>
                            <td class="py-3 px-4"><button onclick="updateGrade('${s.id}')" class="bg-slate-800 text-white px-3 py-1 rounded text-xs hover:bg-slate-700">Запиши</button></td>
                        </tr>`;
                });
            } catch (err) {
                console.error("Грешка при зареждане на данните:", err);
            }
        }

        document.getElementById('create-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            
            const refFile = document.getElementById('reference-file').files[0];
            if (refFile) {
                formData.append('referenceFile', refFile);
            }

            await fetch(`${API_URL}/api/assignments`, {
                method: 'POST',
                body: formData
            });

            document.getElementById('create-form').reset();
            loadData();
        });

        async function updateGrade(id) {
            const points = document.getElementById(`points-${id}`).value;
            const grade = document.getElementById(`grade-${id}`).value;

            await fetch(`${API_URL}/api/submissions/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ points: Number(points), grade })
            });
            alert('Оценката е записана успешно!');
            loadData();
        }

        loadData();
    </script>
</body>
</html>
