<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Предаване на проект - C#</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <div id="loading" class="text-center py-6 text-slate-500">Зареждане на заданието...</div>
        
        <div id="content" class="hidden">
            <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-semibold inline-block mb-4">Активно задание</span>
            <h1 id="task-title" class="text-xl font-bold text-slate-900 mb-2"></h1>
            <p id="task-desc" class="text-sm text-slate-600 mb-6 bg-slate-50 p-3 rounded-xl border border-slate-100"></p>

            <form id="submit-form" class="space-y-4">
                <input type="hidden" id="assignment-id">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Име и Фамилия</label>
                    <input type="text" id="student-name" required placeholder="напр. Иван Петров" class="w-full px-4 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">C# Файл / Архив (.cs, .zip)</label>
                    <input type="file" id="code-file" required accept=".cs,.zip,.rar" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-sm">Предай решението</button>
            </form>
            <div id="response-msg" class="mt-4 text-center text-sm font-medium"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://grading-platform-v2.onrender.com/";
        const urlParams = new URLSearchParams(window.location.search);
        const assignmentId = urlParams.get('id');

        async function init() {
            if (!assignmentId) {
                document.getElementById('loading').innerText = 'Липсва или е невалиден линк към заданието.';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/assignments/${assignmentId}`);
                if (!res.ok) throw new Error();
                const task = await res.json();

                document.getElementById('task-title').innerText = task.title;
                document.getElementById('task-desc').innerText = task.description;
                document.getElementById('assignment-id').value = task.id;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
            } catch (e) {
                document.getElementById('loading').innerText = 'Заданието не е намерено или сървърът е изключен.';
            }
        }

        document.getElementById('submit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('response-msg');
            
            btn.disabled = true;
            btn.innerText = 'Качване...';

            const formData = new FormData();
            formData.append('assignment_id', document.getElementById('assignment-id').value);
            formData.append('student_name', document.getElementById('student-name').value);
            formData.append('codeFile', document.getElementById('code-file').files[0]);

            try {
                const res = await fetch(`${API_URL}/api/submit`, {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();

                if (res.ok) {
                    msg.className = 'mt-4 text-center text-sm font-medium text-emerald-600';
                    msg.innerText = result.message;
                    document.getElementById('submit-form').reset();
                } else {
                    throw new Error(result.error);
                }
            } catch (err) {
                msg.className = 'mt-4 text-center text-sm font-medium text-rose-600';
                msg.innerText = 'Грешка при качване: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = 'Предай решението';
            }
        });

        init();
    </script>
</body>
</html>
